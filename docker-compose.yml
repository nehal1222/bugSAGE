services:
  postgres:
    image: postgres:16-alpine
    container_name: bugsage-db
    environment:
      POSTGRES_DB: bugsage
      POSTGRES_USER: bugsage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugsage_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsage -d bugsage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bugsage:
    build: .
    container_name: bugsage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DATABASE_URL=postgresql://bugsage:${POSTGRES_PASSWORD:-bugsage_secret}@postgres:5432/bugsage
    restart: unless-stopped

volumes:
  pg_data:
