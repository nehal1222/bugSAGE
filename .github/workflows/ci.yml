name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.4.0,<1.0.0"

      - name: Show installed packages
        run: pip list

      - name: Lint with ruff
        run: python -m ruff check app.py --select E,F --ignore E501

      - name: Import check
        env:
          GEMINI_API_KEY: dummy
          GOOGLE_CLIENT_ID: dummy
          DATA_DIR: /tmp
          # DATABASE_URL intentionally unset → SQLite mode, asyncpg not imported
        run: python -c "import app; print('app.py imports OK')"
