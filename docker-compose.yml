version: '3.9'

services:
  bugsage:
    build: .
    container_name: bugsage
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DATA_DIR=/app/data
    restart: unless-stopped

volumes:
  db_data:
